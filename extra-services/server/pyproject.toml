[project]
name = "stillink-services"
version = "2.0.0"
description = "Stillink weather, music, album, todo and calendar services"
requires-python = ">=3.11"
dependencies = [
    "lunar-python>=1.4,<2",
    "pillow>=11.3,<13",
]

[tool.uv]
package = false

[project.optional-dependencies]
windows = ["pystray>=0.19.5; sys_platform == 'win32'"]

[dependency-groups]
dev = ["pyinstaller>=6.22.3; sys_platform == 'win32'"]
