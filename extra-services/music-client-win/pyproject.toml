[project]
name = "stillink-music"
version = "2.0.2"
description = "Windows now-playing cards for Stillink"
requires-python = ">=3.11"
dependencies = [
    "winrt-Windows.Media.Control>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation>=3.2; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections>=3.2; sys_platform == 'win32'",
    "pyyaml>=6.0.3",
    "pystray>=0.19.5",
    "pillow>=11.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
