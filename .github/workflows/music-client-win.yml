name: Windows music client
on:
  push:
    branches: [main]
    paths: ['.github/workflows/music-client-win.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing Release tag (empty for latest)'
        type: string
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync release version
        if: inputs.release_tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: uv run --no-project python tools/set_release_version.py $env:RELEASE_TAG
      - name: Test and build Windows tool
        working-directory: extra-services/music-client-win
        shell: pwsh
        run: |
          uv sync --frozen
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
          uv run --frozen python -m unittest test_music.py
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          ./build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: StillinkMusic-win
          path: extra-services/music-client-win/dist/StillinkMusic-v*-win.zip
      - name: Attach Windows tool to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $musicTag = $env:RELEASE_TAG
          if (-not $musicTag) {
            $musicTag = gh release view --json tagName --jq '.tagName'
            if ($LASTEXITCODE -ne 0) { throw 'No published Release found' }
          }
          $releaseZip = @(Get-Item 'extra-services/music-client-win/dist/StillinkMusic-v*-win.zip')
          if ($releaseZip.Count -ne 1) { throw 'Expected one versioned ZIP' }
          gh release upload $musicTag ($releaseZip[0].FullName) --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
          $musicExeAsset = gh release view $musicTag --json assets --jq '.assets[] | select(.name == "StillinkMusic.exe") | .name'
          if ($LASTEXITCODE -ne 0) { throw 'Release asset lookup failed' }
          if ($musicExeAsset) {
            gh release delete-asset $musicTag StillinkMusic.exe --yes
            if ($LASTEXITCODE -ne 0) { throw 'Standalone EXE removal failed' }
          }
          $legacyZip = gh release view $musicTag --json assets --jq '.assets[] | select(.name == "StillinkMusic-win.zip") | .name'
          if ($LASTEXITCODE -ne 0) { throw 'Release asset lookup failed' }
          if ($legacyZip) {
            gh release delete-asset $musicTag StillinkMusic-win.zip --yes
            if ($LASTEXITCODE -ne 0) { throw 'Legacy ZIP removal failed' }
          }
