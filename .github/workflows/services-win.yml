name: Windows extra services
on:
  push:
    branches: [main]
    paths: ['.github/workflows/services-win.yml']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing Release tag (empty for latest)'
        type: string
  workflow_call:
    inputs:
      release_tag:
        type: string
        default: ''
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Sync release version
        if: inputs.release_tag != ''
        shell: pwsh
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: uv run --no-project python tools/set_release_version.py $env:RELEASE_TAG
      - name: Test and build portable services
        working-directory: extra-services/server
        shell: pwsh
        run: |
          uv sync --frozen --extra windows --group dev
          if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
          uv run --frozen --extra windows python -m unittest discover -p 'test_*.py'
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          ./build-win.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: StillinkServices-win
          path: extra-services/server/dist/StillinkServices-v*-win.zip
          if-no-files-found: error
      - name: Attach service ZIP to Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          $servicesTag = $env:RELEASE_TAG
          if (-not $servicesTag) {
            $servicesTag = gh release view --json tagName --jq '.tagName'
            if ($LASTEXITCODE -ne 0) { throw 'No published Release found' }
          }
          $releaseZip = @(Get-Item 'extra-services/server/dist/StillinkServices-v*-win.zip')
          if ($releaseZip.Count -ne 1) { throw 'Expected one versioned ZIP' }
          gh release upload $servicesTag ($releaseZip[0].FullName) --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Service ZIP upload failed' }
          $legacyZip = gh release view $servicesTag --json assets --jq '.assets[] | select(.name == "StillinkServices-win.zip") | .name'
          if ($LASTEXITCODE -ne 0) { throw 'Release asset lookup failed' }
          if ($legacyZip) {
            gh release delete-asset $servicesTag StillinkServices-win.zip --yes
            if ($LASTEXITCODE -ne 0) { throw 'Legacy ZIP removal failed' }
          }
