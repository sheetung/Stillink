name: Firmware release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chip: [esp32s3, esp32c3]
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python tools/set_release_version.py "$GITHUB_REF_NAME"
          idf.py set-target ${{ matrix.chip }}
          idf.py build
          python tools/package_bins.py "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.chip }}
          path: build/dist/*.bin
          if-no-files-found: error
  publish:
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os, re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          changelog = Path('docs/CHANGELOG.md').read_text(encoding='utf-8')
          match = re.search(r'^## ' + re.escape(tag.upper()) + r'[^\n]*\n(.*?)(?=^## |\Z)', changelog, re.M | re.S)
          if not match:
              raise SystemExit(f'Missing changelog for {tag}')
          Path('release-notes.md').write_text(match.group(1).strip() + '\n', encoding='utf-8')
          PY
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: release-assets
          merge-multiple: true
      - name: Publish firmware
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: release-assets/*.bin
          fail_on_unmatched_files: true
  music:
    needs: publish
    uses: ./.github/workflows/music-client-win.yml
    with:
      release_tag: ${{ github.ref_name }}
