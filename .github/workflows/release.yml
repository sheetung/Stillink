name: Firmware release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        chip: [esp32s3, esp32c3]
    container: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v4
      - name: Build firmware
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          python tools/set_release_version.py "$GITHUB_REF_NAME"
          idf.py set-target ${{ matrix.chip }}
          idf.py build
          python tools/package_bins.py "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.chip }}
          path: firmware/*.bin
          if-no-files-found: error
  publish:
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: firmware
          merge-multiple: true
      - name: Publish firmware
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: firmware/*.bin
          fail_on_unmatched_files: true
  music:
    needs: publish
    uses: ./.github/workflows/music-client-win.yml
    with:
      release_tag: ${{ github.ref_name }}
