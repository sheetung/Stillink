name: Online flasher
on:
  push:
    branches: [main]
    paths:
      - 'extra-services/web-flasher/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: extra-services/web-flasher/package-lock.json
      - name: Build page from Release assets
        working-directory: extra-services/web-flasher
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: extra-services/web-flasher/public
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
